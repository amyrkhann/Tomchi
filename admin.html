<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jet Delivery Admin</title><style>
body{font-family:Arial;margin:0;background:#f5f6f8}.wrap{max-width:1050px;margin:auto;padding:35px 5%}.card{background:#fff;padding:22px;border-radius:18px;margin:15px 0}input,select{padding:11px;border:1px solid #ddd;border-radius:9px}button{padding:11px 15px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:8px 0}.order{padding:15px 0;border-top:1px solid #eee}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef2f4;font-size:12px;font-weight:700}.free{background:#eaffcf}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>JET DELIVERY — Админ</h1><div class="card"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button onclick="login()">Войти</button></div><div id="panel" style="display:none"><div class="card"><h2>Бесплатная зона</h2><p>Радиус указывается в метрах. Адрес доставки бесплатен, если находится в радиусе хотя бы одной точки отправления.</p><div id="zones"></div><button onclick="save()">Сохранить радиусы</button></div><div class="card"><h2>Заказы</h2><div id="orders"></div></div></div></div>
<script>
let token='';async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(u,o),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка');return x}
async function login(){token=document.getElementById('token').value;try{document.getElementById('panel').style.display='block';const z=await api('/api/zone-settings');document.getElementById('zones').innerHTML=z.map((x,i)=>`<div class="row"><input data-i="${i}" class="addr" value="${x.address}" readonly><input data-i="${i}" class="rad" type="number" min="0" value="${x.radius}" placeholder="метров"></div>`).join('');render(await api('/api/orders'))}catch(e){alert(e.message)}}
async function save(){const a=[...document.querySelectorAll('.addr')].map((x,i)=>({address:x.value,radius:+document.querySelectorAll('.rad')[i].value}));await api('/api/zone-settings',{method:'PUT',body:JSON.stringify({pickupPoints:a})});alert('Радиусы сохранены')}
function render(a){document.getElementById('orders').innerHTML=a.map(o=>`<div class="order"><b>#${o.id}</b> ${o.name} · ${o.phone}<br>${o.pickup} → ${o.address}<br><span class="tag ${o.free?'free':''}">${o.free?'Бесплатно 0 ₸':'Вне бесплатной зоны'}</span> <span class="tag">${o.distance||'?'} м</span> <select onchange="st(${o.id},this.value)"><option>${o.status}</option><option>Принят</option><option>Курьер назначен</option><option>Забран</option><option>В пути</option><option>Доставлен</option><option>Отменён</option></select></div>`).join('')||'Нет заказов'}
async function st(id,status){await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({status})})}
</script></body></html>
